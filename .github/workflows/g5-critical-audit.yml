name: G5 fresh production critical dependency audit
on:
  push:
    branches:
      - codex/rm-sec-001-g1-baseline
    paths:
      - '.github/workflows/g5-critical-audit.yml'
      - 'scripts/security/g5-critical-audit.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit exact production graph and print critical paths
        run: node scripts/security/g5-critical-audit.cjs
      - name: Store complete audit JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: g5-critical-audit-${{ github.sha }}
          path: |
            g5-audit-evidence/
          retention-days: 30
          if-no-files-found: error
